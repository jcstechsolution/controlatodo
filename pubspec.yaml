name: controlatodo
description: "Organiza tus pagos. Nunca olvides un vencimiento."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Estado
  provider: ^6.1.2

  # Navegación
  go_router: ^14.2.7

  # UI / utilidades
  intl: ^0.19.0
  table_calendar: ^3.1.2
  fl_chart: ^0.69.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Escáner de facturas (OCR en el dispositivo, sin costo ni internet)
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
